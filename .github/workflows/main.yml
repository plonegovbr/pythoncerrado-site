name: CI

on:
  push:
    paths:
      - "backend/**"
      - "devops/**"
      - "frontend/**"
      - ".github/workflows/*.yml"
      - "*.md"
      - "*.toml"
      - "docker-compose*"

  workflow_dispatch:

jobs:
  config:
    uses: ./.github/workflows/config.yml

  backend:
    uses: ./.github/workflows/backend.yml
    needs:
        - config
    with:
        base-tag: ${{ needs.config.outputs.base-tag }}
        image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
        image-name-suffix: backend
        python-version: ${{ needs.config.outputs.python-version }}
        plone-version: ${{ needs.config.outputs.plone-version }}
    if: ${{ needs.config.outputs.backend == 'true' }}
    permissions:
      contents: read
      packages: write
  frontend:
    uses: ./.github/workflows/frontend.yml
    needs:
        - config
    with:
        base-tag: ${{ needs.config.outputs.base-tag }}
        image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
        image-name-suffix: frontend
        node-version: ${{ needs.config.outputs.node-version }}
        volto-version: ${{ needs.config.outputs.volto-version }}
        storybook-deploy: ${{ needs.config.outputs.storybook-deploy == 'true' }}
    if: ${{ needs.config.outputs.frontend == 'true' }}
    permissions:
      contents: write
      packages: write

  # Deploys to production only what this push built: the paths filter in
  # config skips the unchanged side, whose sha- image tag does not exist.
  deploy:
    uses: ./.github/workflows/deploy.yml
    needs:
      - config
      - backend
      - frontend
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success')
    with:
      backend-image: ${{ needs.config.outputs.image-name-prefix }}-backend
      backend-tag: ${{ needs.config.outputs.base-tag }}
      backend-deploy: ${{ needs.backend.result == 'success' }}
      frontend-image: ${{ needs.config.outputs.image-name-prefix }}-frontend
      frontend-tag: ${{ needs.config.outputs.base-tag }}
      frontend-deploy: ${{ needs.frontend.result == 'success' }}
    secrets:
      backend-webhook: ${{ secrets.WEBHOOK_BACKEND }}
      frontend-webhook: ${{ secrets.WEBHOOK_FRONTEND }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - backend
      - frontend
      - deploy
    steps:
      - name: Write report
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| backend | ${{ needs.backend.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| frontend | ${{ needs.frontend.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| deploy | ${{ needs.deploy.result }} |' >> $GITHUB_STEP_SUMMARY
